# ---------------------------------------------------------------------------
# Phantom Olympiad
# ---------------------------------------------------------------------------
# A fixed roster of phantom nobles that take part in the Grand Olympiad, so a solo player gets opponents and
# phantom-only matches run for anyone who wants to watch them from an Olympiad Manager.
#
# The Olympiad itself is configured in config/Olympiad.ini, not here: the schedule (OlympiadStartTime,
# OlympiadCPeriod), how many sign-ups a match needs (OlympiadClassedParticipants, OlympiadNonClassedParticipants),
# points and rewards. The nobles follow those rules exactly like a real player does.
#
# Roster nobles live on their own account ('phantom_noble'), so they keep their Olympiad points, record and any
# Hero status between restarts. They log in when the competition opens, wait near the Olympiad Managers, and log out
# when it closes.

# Master switch. Needs OlympiadEnabled = True in config/Olympiad.ini as well.
# Default: True
PhantomOlympiadEnabled = True

# How many phantom nobles the base roster has. They are spread over the 31 Interlude third classes, so 40 gives
# every class at least one noble and nine classes a second one. Rivals created for a player's class (below) do not
# count toward this size, except toward their own class's share.
# Raising it creates the extra nobles the next time the competition opens. Lowering it does not remove nobles
# that already exist: every noble on the roster account logs in for the competition.
# Default: 40
PhantomOlympiadRosterSize = 40

# Level range for newly created nobles (third class, so 76 to 80). An existing noble keeps its level.
# Default: 76 and 80
PhantomOlympiadMinLevel = 76
PhantomOlympiadMaxLevel = 80

# A classed match needs OlympiadClassedParticipants nobles of the same class. When a real player signs up, the
# roster makes sure at least this many nobles of that player's class exist, creating extra ones if needed. They
# stay on the roster afterwards. 0 turns this off.
# Default: 6
PhantomOlympiadRivalsPerClass = 6

# While no real player is signed up, each idle noble has this percent chance per check (every 30 seconds) to sign
# up for a non-classed match, so phantom-only matches keep running to watch. While a real player is signed up,
# idle nobles sign up straight away so the player's pools fill. 0 means nobles only sign up when a player does.
# Default: 10
PhantomOlympiadSignUpChancePercent = 10

# How long a noble waits after a match before it may sign up again, in seconds.
# Default: 180
PhantomOlympiadRestSeconds = 180

# Stock Interlude removes a player from their party when a match starts. When True, your recruited party members
# and buddies wait where they are during your match and rejoin your party when you come back.
# Default: True
PhantomOlympiadRejoinParty = True
