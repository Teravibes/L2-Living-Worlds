# =================================================================
# Module Framework
# =================================================================
# Platform-level settings for the optional module framework. These are
# separate from any individual module's own config/module.ini file.
#
# Nothing here turns a feature on by itself. Each installed module has its
# own master switch in its own config/module.ini, and a module does nothing
# until that switch is set. With no modules installed, this file has no effect
# and the server behaves exactly as stock.

# Master switch for the whole framework. When False, no module is discovered
# or enabled, whatever each module's own switch says.
EnableModules = True

# Directory scanned for installed modules. Leave blank for the default,
# which is a "modules" folder next to the server's data directory.
ModulesRoot =
