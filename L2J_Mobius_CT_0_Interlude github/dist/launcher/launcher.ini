# ============================================================================
#  L2 Offline Server - One-Click Launcher settings
#  Edit these to match your machine. Lines starting with # are comments.
# ============================================================================

[java]
# Folder that contains bin\java.exe. Leave BLANK to auto-detect in this order:
#   1) a bundled runtime at  dist\jre\bin\java.exe   (for a portable pack)
#   2) the JAVA_HOME environment variable
#   3) java on your PATH
# You need JDK/JRE 25 for the game server.
JavaHome=

[database]
Host=localhost
Port=3306
User=root
Password=
Database=l2jmobiusinterlude
# Folder containing mysql.exe / mysqld.exe.
#   - External MySQL/XAMPP:  an absolute path, e.g. C:\xampp\mysql\bin
#   - Bundled MariaDB pack:   a path RELATIVE to dist\, e.g. mariadb\bin
# Relative paths are resolved against the dist\ folder, so the pack stays portable.
MysqlBin=C:\xampp\mysql\bin
# DataDir: set ONLY for a bundled/portable MariaDB. It is the MariaDB data folder.
#   - Leave BLANK when using an external MySQL/XAMPP (that engine owns its own data dir).
#   - For the bundled pack this is set to  mariadb\data  (relative to dist\); on first run
#     the launcher initializes it (creates root with no password) before starting the DB.
DataDir=
# If the DB port is not open, try to start the DB engine automatically.
AutoStartMysql=true

[servers]
StartLogin=true
StartGame=true
# Start the Python FPC "brain" too. Off by default. When true, the launcher starts it
# non-interactively and ONLY if it has already been set up (run Configure-Brain.bat, or
# the Control Panel "Set up / configure brain" button, once first). If it is not set up,
# boot skips it without prompting, so the server never hangs waiting for input.
StartBrain=false

[client]
# Optionally launch the L2 game client once the server is up, so a single
# double-click starts the whole thing - server and game.
#   - ClientExe: full path to the exe you normally run, e.g. C:\L2\system\L2.exe
#     (or your own patcher/bootstrapper exe). Leave BLANK to not launch a client.
#   - LaunchClient: set true to launch it. Easiest way to set both is the Control
#     Panel "Set game client..." button + "Launch the game client too" checkbox.
# Note: the launcher only OPENS the client. Making the client connect to your
# server (its server-list address) is the client's own one-time l2.ini setup.
ClientExe=
LaunchClient=false

[discord]
# Show your character (name, level and class) on your Discord profile while the
# launcher is open. Needs the Discord desktop app running on this PC.
Enabled=true
# Discord application ID. Leave BLANK to use the one built into the launcher.
ClientId=
